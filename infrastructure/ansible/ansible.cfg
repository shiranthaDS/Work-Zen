# =============================================================================
# Work-Zen - Ansible Configuration
# =============================================================================

[defaults]
# Inventory
inventory = inventory/

# SSH settings
host_key_checking = False
remote_user = ubuntu
private_key_file = ~/Downloads/EMSkey.pem

# Performance
forks = 10
pipelining = True

# Output
stdout_callback = yaml
callback_whitelist = profile_tasks, timer

# Retry
retry_files_enabled = False

# Roles path
roles_path = roles/

# Logging
log_path = logs/ansible.log

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

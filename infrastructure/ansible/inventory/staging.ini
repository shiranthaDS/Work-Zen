# =============================================================================
# Ansible Inventory - Staging Environment
# =============================================================================
# This is a template - Terraform will auto-generate this file
# For manual setup, update the IP address below
# =============================================================================

[app_servers]
staging-app ansible_host=<STAGING_IP_HERE>

[app_servers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/Downloads/EMSkey.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[staging:children]
app_servers

[all:vars]
environment=staging

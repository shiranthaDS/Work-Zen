---
# =============================================================================
# Work-Zen Server Setup Playbook
# =============================================================================
# Purpose: Configure EC2 instances after Terraform provisioning
# Usage: ansible-playbook -i inventory/staging.ini playbooks/setup.yml
# =============================================================================

- name: Configure Work-Zen Application Server
  hosts: app_servers
  become: yes
  gather_facts: yes

  vars:
    app_user: ubuntu
    app_dir: /home/ubuntu/Work-Zen
    docker_compose_version: "2.24.0"

  pre_tasks:
    - name: Display target information
      debug:
        msg: |
          🚀 Configuring Work-Zen Server
          ================================
          Environment: {{ environment }}
          Host: {{ inventory_hostname }}
          IP: {{ ansible_host }}
          ================================

  tasks:
    # =========================================================================
    # System Updates
    # =========================================================================
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
      when: upgrade_packages | default(false)

    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3
          - python3-pip
          - git
          - htop
          - vim
          - unzip
          - jq
        state: present

    # =========================================================================
    # Docker Installation
    # =========================================================================
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes

    # =========================================================================
    # Application Setup
    # =========================================================================
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Clone/Update Work-Zen repository
      git:
        repo: "https://github.com/shiranthaDS/Work-Zen.git"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: "{{ app_user }}"

    # =========================================================================
    # Firewall Configuration
    # =========================================================================
    - name: Install UFW firewall
      apt:
        name: ufw
        state: present

    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow required ports
      ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop:
        - { port: '22', proto: 'tcp', comment: 'SSH' }
        - { port: '80', proto: 'tcp', comment: 'HTTP' }
        - { port: '443', proto: 'tcp', comment: 'HTTPS' }
        - { port: '3000', proto: 'tcp', comment: 'Frontend' }
        - { port: '8000', proto: 'tcp', comment: 'Backend API' }

    - name: Enable UFW
      ufw:
        state: enabled

    # =========================================================================
    # System Optimization
    # =========================================================================
    - name: Set timezone
      timezone:
        name: UTC

    - name: Configure system limits for Docker
      pam_limits:
        domain: "*"
        limit_type: "{{ item.type }}"
        limit_item: "{{ item.item }}"
        value: "{{ item.value }}"
      loop:
        - { type: 'soft', item: 'nofile', value: '65536' }
        - { type: 'hard', item: 'nofile', value: '65536' }

  post_tasks:
    - name: Display completion message
      debug:
        msg: |
          ✅ Server configuration complete!
          ================================
          Next steps:
          1. Copy .env file to {{ app_dir }}
          2. Run: ansible-playbook -i inventory/{{ environment }}.ini playbooks/deploy.yml
          ================================

  handlers:
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted
